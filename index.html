<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ===============================
         Google Analytics
    ================================ -->

    <script async
        src="https://www.googletagmanager.com/gtag/js?id=G-NP8F2S4STN">
    </script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());

        gtag('config', 'G-NP8F2S4STN');
    </script>


    <!-- ===============================
         Meta
    ================================ -->

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Online Picks | Hello Madhu Youtube Channel</title>

    <meta name="description"
        content="Discover the latest genuine products featured in our Hello Madhu Youtube Channel. Shop trusted recommendations with our affiliate links.">


    <!-- ===============================
         CSS
    ================================ -->

    <link rel="stylesheet"
        href="style.css?v=15">


    <!-- ===============================
         Google Font
    ================================ -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>


<body>


    <!-- ===============================
         HEADER
    ================================ -->

    <header>

        <div class="container">

            <h1>Online Picks</h1>

            <p class="tagline">
                Latest Genuine Online products featured in our Hello Madhu Youtube videos.
            </p>

        </div>

    </header>


    <!-- ===============================
         MAIN
    ================================ -->

    <main class="container">


        <!-- ===============================
             SEARCH
        ================================ -->

        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search products..."
                autocomplete="off">

        </section>


        <!-- ===============================
             RESULT COUNT
        ================================ -->

        <section class="info-bar">

            <p id="productCount">
                Loading products...
            </p>

        </section>


        <!-- ===============================
             STORE SECTIONS
        ================================ -->

        <section
            id="productsContainer"
            class="stores-container">

            <!-- Store sections are created by JavaScript -->

        </section>

    </main>


    <!-- ===============================
         FOOTER
    ================================ -->

    <footer>

        <div class="container">

            <p>
                <strong>Disclosure:</strong>
                As an Online Products Associate, we earn from qualifying purchases.
            </p>

            <p>
                © 2026 Hello,Madhu. All Rights Reserved.
            </p>

        </div>

    </footer>


    <!-- ===============================
         PRODUCT TEMPLATE
    ================================ -->

    <template id="productTemplate">

        <article class="product-card">


            <!-- Product Image -->

            <div class="product-image-container">

                <img
                    class="product-image"
                    alt=""
                    loading="lazy">

                <div class="image-placeholder">

                    <span>🛍️</span>

                    <p>Product</p>

                </div>

            </div>


            <!-- Card Header -->

            <div class="card-header">

                <span class="category"></span>

                <span class="latest-badge">
                    NEW
                </span>

            </div>


            <!-- Product Name -->

            <h3 class="product-name"></h3>


            <!-- Price -->

            <p class="price"></p>


            <!-- Store -->

            <span class="store-badge"></span>


            <!-- Normal Buy Button -->

            <a
                class="buy-button"
                target="_blank"
                rel="noopener noreferrer">

                Buy Now

            </a>


            <!-- Multiple Links -->

            <div class="product-links">

                <p class="links-title">
                    Available Options
                </p>

                <div class="links-list"></div>

            </div>

        </article>

    </template>


    <!-- ===============================
         JAVASCRIPT
    ================================ -->

    <script src="script.js?v=15"></script>

</body>

</html>
